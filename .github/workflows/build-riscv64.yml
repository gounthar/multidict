name: Build riscv64 wheel

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Upstream release tag to build from'
        required: false
        type: string
  schedule:
    - cron: '0 3 * * 0'  # Sunday 03:00 UTC

jobs:
  build:
    runs-on: [self-hosted, linux, riscv64]
    timeout-minutes: 60
    steps:
      - name: Resolve upstream tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          # This fork holds the workflow only: its master carries no source
          # patches and never mirrors upstream tags, so checking a tag out of
          # the fork fails with "a branch or tag with the name ... could not be
          # found". Build from the upstream source instead.
          TAG="${RELEASE_TAG:-}"
          if [ -z "$TAG" ]; then
            TAG=$(gh api repos/aio-libs/multidict/releases/latest --jq .tag_name)
          fi
          if ! gh api "repos/aio-libs/multidict/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::upstream tag $TAG does not exist in aio-libs/multidict"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Building from upstream tag $TAG"

      - name: Checkout upstream source
        uses: actions/checkout@v4
        with:
          repository: aio-libs/multidict
          ref: ${{ steps.tag.outputs.tag }}
          fetch-depth: 0
          submodules: recursive
          # The build runs upstream's build backend over this tree, so do not
          # leave the token readable in .git/config. Nothing later in this job
          # runs git. The release job's checkout keeps its credentials: it
          # pushes a tag deletion.
          persist-credentials: false

      - name: Set up Python
        run: |
          python3 -m venv /tmp/build-venv
          . /tmp/build-venv/bin/activate
          pip install --upgrade pip 'setuptools>=77,<81' wheel cython

      - name: Build wheel
        run: |
          . /tmp/build-venv/bin/activate
          pip wheel --no-deps --no-build-isolation --wheel-dir /tmp/wheels/ .

      - name: Verify platform tag
        run: |
          ls /tmp/wheels/*.whl
          for whl in /tmp/wheels/*.whl; do
            if echo "$whl" | grep -q "linux_riscv64\|manylinux.*riscv64"; then
              echo "OK: $whl"
            else
              echo "FAIL: $whl does not have riscv64 platform tag"
              exit 1
            fi
          done

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel-riscv64
          path: /tmp/wheels/*.whl
          retention-days: 90

      - name: Cleanup
        if: always()
        run: rm -rf /tmp/build-venv /tmp/wheels

  release:
    needs: build
    runs-on: ubuntu-latest
    if: success()
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download wheel artifact
        uses: actions/download-artifact@v4
        with:
          name: wheel-riscv64
          path: /tmp/wheels/

      - name: Get wheel info
        id: wheel_info
        run: |
          WHL=$(ls /tmp/wheels/*.whl | head -1)
          BASENAME=$(basename "$WHL")
          VERSION=$(echo "$BASENAME" | sed 's/^[^-]*-\([^-]*\)-.*/\1/')
          echo "whl_path=$WHL" >> "$GITHUB_OUTPUT"
          echo "whl_name=$BASENAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Generate checksums
        run: |
          cd /tmp/wheels
          sha256sum *.whl > SHA256SUMS

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="riscv64-v${{ steps.wheel_info.outputs.version }}"
          TITLE="riscv64 wheel v${{ steps.wheel_info.outputs.version }}"
          gh release delete "$TAG" --yes 2>/dev/null || true
          git tag -d "$TAG" 2>/dev/null || true
          git push origin ":refs/tags/$TAG" 2>/dev/null || true
          gh release create "$TAG" \
            --title "$TITLE" \
            --notes "Prebuilt riscv64 wheel for multidict.

          Built on: BananaPi F3 (SpacemiT K1, rv64imafdcv)
          Python: built on riscv64 self-hosted runner
          Wheel: ${{ steps.wheel_info.outputs.whl_name }}

          Install:
          \`\`\`
          pip install multidict --extra-index-url https://gounthar.github.io/riscv64-python-wheels/simple/
          \`\`\`" \
            /tmp/wheels/*.whl \
            /tmp/wheels/SHA256SUMS

      - name: Cleanup
        if: always()
        run: rm -rf /tmp/wheels

  notify-index:
    needs: release
    runs-on: ubuntu-latest
    if: success()
    steps:
      - name: Trigger index update
        env:
          GH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
        run: |
          gh api repos/gounthar/riscv64-python-wheels/dispatches \
            -f event_type=fork-release-published \
            -f "client_payload[repo]=${{ github.repository }}" \
            -f "client_payload[tag]=${{ github.ref_name }}"
